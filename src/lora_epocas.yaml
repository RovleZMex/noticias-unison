# Fine-tuning LoRA de Qwen2.5-0.5B-Instruct para escribir notas con el estilo de cada época.
#   .venv-llm/bin/mlx_lm.lora --config src/lora_epocas.yaml
model: "Qwen/Qwen2.5-0.5B-Instruct"
train: true
data: "data/llm"
adapter_path: "modelos/lora-epocas"
fine_tune_type: lora
num_layers: -1            # LoRA en las 24 capas
batch_size: 4
iters: 2000               # ~1 época sobre 8,043 notas
learning_rate: 3.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [3.0e-5, 2000, 1.0e-6]
max_seq_length: 1024
mask_prompt: true         # la pérdida solo cuenta el cuerpo de la nota, no el titular ni el sistema
grad_checkpoint: false
steps_per_report: 25
steps_per_eval: 250
val_batches: 20
save_every: 500
seed: 0
lora_parameters:
  rank: 16
  scale: 10.0
  dropout: 0.05
